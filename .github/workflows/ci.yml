name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mingw64-release:
    name: MSYS2 MinGW64 release verification
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Verify release build
        run: scripts/verify_release_mingw64.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMSFramework-package
          path: build-release-mingw64/DLMSFramework-*.zip
          if-no-files-found: error
